        <style>

            body
            {
                background-image: url("assets/bg_glitch.png");
                background-repeat: repeat;
            }

            .glitch

                background-image: url("assets/image_glitch.png");
                background-size: contain;
                background-position: center;
                background-repeat: no-repeat;

                max-width: 100%;

            }

            a {

            #center {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            #ytand {
                position: relative;
                display: grid;
                width: 100vw;
                height: 100vh;
                margin: 0;
                color: #353535;
                place-items: center center;
            }

            #ytand #image {
                width: 100vw;
                height: 100vh;
                background-repeat: repeat;
            }

            #ytand #text {
                position: absolute;
                left: 0;
                top: 0;
                width: 810px;
                z-index: 10;
                text-align: center;
                font-family: Tahoma, sans-serif;
            }

            #ytand #text div {
                position: absolute;
                width: 810px;
            }

        <script>

            var results = new Howl({
                src: ['assets/mus_glitch.ogg'],

            $(document).on('click', '.glitch:not(.playing)', function ()

                results.play();
                $('.glitch').addClass('playing');
            });

            $(document).on('click', '.glitch.playing', function () 
            {
                results.pause();
                $('.glitch').removeClass('playing');
            });
