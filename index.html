<body>  

    <header>
        <nav class="navbar">
            <ul>
                <li><a href="">archives update</a></li>
                <li><a href="glitch.html">??? update</a></li>
                <li><a href="glitch.html">floor 3 update</a></li>
            </ul>

    </header>

    <main>   
        <div class="button">
            <button id="btn" onclick="btnClick(this)"> show days </button>
        </div>
        <div class="container">
            <img src="assets/backgroundtest2.png" alt="background image" oncontextmenu="return false;" ondrag="return false;">
        
            <div class="textcontainer">
                <span id="timer"> ... </span>
            </div>
        </div>
    </main>

    <footer>
        <div>
            <span>
                <a class="DOORS" href="https://www.roblox.com/games/6516141723/DOORS">DOORS 👁️</a> by <a class="LSPLASH" href="https://www.roblox.com/communities/3049798/LSPLASH">LSPLASH</a>. This website is not affiliated in any way with <a class="LSPLASH" href="https://www.roblox.com/communities/3049798/LSPLASH">LSPLASH</a> or any of the developers or the game or anything at all. 
            </span>
        </div>
        </div>
    </footer>

<script>

    let update = new Date("2026-08-28T20:00:00+02:00").getTime();
    let timer = document.getElementById("timer");

    let days = false;

    function btnClick(btn)
    {
        days = !days; 
        calcTime(); 

        timer.style.fontSize = days? "6.4vw" : "8.4vw";
        btn.textContent = days? "show hours" : "show days";
    }

    function calcTime() 
    {
        let now = new Date().getTime();
        let time = Math.floor((update - now) / 1000);

        if (time <= 0) 
        {
            clearInterval(interval);
            timer.textContent = "OUT NOW";
            document.title = "OUT NOW";
            return;
        }

        let d = 0;
        let h = Math.floor(time / 3600);
        let m = Math.floor((time % 3600) / 60);
        let s = time % 60;

        if(days)
        {
            d = Math.floor(h / 24);
            h = Math.floor(h % 24);

            d = d < 10? "0" + d : d;
        }

        h = h < 10 ? "0" + h : h;
        m = m < 10 ? "0" + m : m;
        s = s < 10 ? "0" + s : s;

        let out = (days ? d + ":" : "") + h + ":" + m + ":" + s;
        timer.textContent = out;
        document.title = out;

    }

    window.onload = function () 
    {
        calcTime();
        let interval = setInterval(function () 
        {
            calcTime();
        }, 1000);   
    };

</script>
</body>
</html>
